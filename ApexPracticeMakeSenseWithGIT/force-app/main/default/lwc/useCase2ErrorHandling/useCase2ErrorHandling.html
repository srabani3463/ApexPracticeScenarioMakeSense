<template>
    <!--Create a form That user fill basic information Name, Age, Phone, if anything wrong then through an error.-->
    <lightning-card title="User Information Form " icon-name="standard:contact">
     <div class="slds-p-around_medium">
    
        <lightning-input label="Name" value={name}   onchange = {handleChange} data-field ="name" required></lightning-input>
        <lightning-input label="Email" value={email} onchange = {handleChange} data-field ="email"  required></lightning-input>
        <lightning-input label="Phone" value={phone} onchange = {handleChange} data-field ="phone"></lightning-input>
        <lightning-input label="Age" value={age}     onchange = {handleChange} data-field ="age" ></lightning-input>

<lightning-button variant="brand" label="Submit" title="Submit" onclick={handleSubmit}
 class="slds-m-top_small"></lightning-button>

 <template if:true={errorMessage}>
   <div class="slds-text-color_error slds-m-top_small">
     {errorMessage}
</div>

 </template>


     </div>



    </lightning-card>
</template>
